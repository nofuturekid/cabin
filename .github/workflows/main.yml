name: Main image

# Spec 0014 FR-5: refresh the moving :main tag. Same build as the release
# lane, only the tag and the stamped version differ.
#
# Triggered by CI finishing rather than by the push itself: both workflows
# would otherwise start from the same event and race, and :main -- the tag
# people actually pull -- would move even when the test suite came back red.
# A docs-only push does not run CI (paths-ignore) and so does not rebuild the
# image either, which is the intended behaviour.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nofuturekid/cabin

jobs:
  image:
    name: Build and push :main (amd64, arm64)
    runs-on: ubuntu-latest
    # Only green CI publishes, and a manual run has to come from main as
    # well -- :main must never describe another branch.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main')
    steps:
      # workflow_run runs in the context of the default branch, so the commit
      # CI actually tested has to be named explicitly.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A :main image is not a release, so it reports the pyproject version
      # with a PEP 440 local segment naming the commit it was built from —
      # visible in /healthz and the UI footer.
      - name: Resolve version
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          base="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${base}+main.$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:main
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
