name: Release

# Spec 0014 FR-4: publish the multi-arch image for a release tag. Stable
# releases move :latest, prereleases move :beta. No external secrets — the
# job authenticates to GHCR with the token GitHub hands the run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build, e.g. v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Publish as :beta instead of :latest"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nofuturekid/cabin

jobs:
  image:
    name: Build and push (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      # First, before anything checks out or runs from that tag: tag names
      # come from whoever cut the release, so they reach the shell through
      # the environment and are validated there — never interpolated into
      # the script body.
      - name: Resolve version and tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          RAW_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -eu
          version="${RAW_TAG#v}"
          case "$version" in
            "" | *[!0-9A-Za-z.+-]*)
              echo "refusing to build from tag '$RAW_TAG'" >&2
              exit 1
              ;;
          esac
          if [ "$EVENT" = "workflow_dispatch" ]; then
            prerelease="$INPUT_PRERELEASE"
          else
            prerelease="$RELEASE_PRERELEASE"
          fi
          tags="${IMAGE}:${version}"
          if [ "$prerelease" = "true" ]; then
            tags="${tags},${IMAGE}:beta"
          else
            tags="${tags},${IMAGE}:latest"
          fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # FR-6: stamped into the wheel's metadata, which is what
          # /healthz and the UI footer report.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
