name: CI

# Lint/type/test. Skipped for docs-only changes (paths-ignore) — there are no
# required status checks on main, so a skipped run does not block merges.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "spec/**"
      - "deploy/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "spec/**"
      - "deploy/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff format (check)
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest
