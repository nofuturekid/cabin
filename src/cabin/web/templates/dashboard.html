{% extends "layout.html" %}
{% set nav_current = "dashboard" %}
{% block title %}Dashboard — cabin{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Dashboard</h1>
    <p class="sub">Logged in as {{ user.username }} ({{ user.role }}).</p>
  </div>
</div>
{% if not ca_configured %}
<div class="error"><a href="/ca">CA: not set up</a></div>
{% endif %}
<p class="note">cabin version {{ version }}.</p>
{% endblock %}
