{% extends "layout.html" %}
{% block title %}Setup — cabin{% endblock %}
{% block content %}
<div class="card-narrow">
  <h1>Create the superadmin account</h1>
  <p class="note">This is a one-time setup. This account can manage all other users.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/setup">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" minlength="12" required />
    </div>
    <div class="actions"><button type="submit" class="primary">Create account</button></div>
  </form>
</div>
{% endblock %}
